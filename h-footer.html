<footer class="rcx-footer" aria-label="RCX Group">
    <div class="rcx-footer__inner">
        <div class="rcx-footer__top">
            <div class="rcx-footer__brand">
                <a class="rcx-footer__home" href="/" aria-label="RCX Group home">
                    <img class="rcx-footer__logo" src="$logo" alt="RCX Group" width="190" height="56" loading="lazy">
                </a>
                $socials
            </div>
            $navigation
        </div>
        <dl class="rcx-footer__contacts">$contacts</dl>
        <div class="rcx-footer__bottom">
            <p class="rcx-footer__copyright">&copy; $year $company <span>$registration</span> All rights reserved.</p>
            $legal
        </div>
    </div>
</footer>
